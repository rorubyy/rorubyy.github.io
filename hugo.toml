
baseURL = 'https://rorubyy.github.io/'
languageCode = 'zh-tw'
title = '哈庫那馬塔塔٩( ˵ᐛ ˵)۶'
theme = 'PaperMod'

[params.profileMode]
  enabled = false

[author]
  name = "rorubyy"

[pagination]
  pagerSize = 6  # 首頁顯示 6 篇文章
[params]
  description = "學習與輸出的角落 - 記錄技術、閱讀、生活的個人部落格"
  keywords = ["技術筆記", "閱讀心得", "生活記錄", "LLM", "程式開發"]
  author = "rorubyy"
  images = ["/images/og-image.png"]  # 如果有首頁圖片的話
  defaultTheme = "auto"  # auto, light, dark
  ShowReadingTime = true
  ShowShareButtons = false  # 關閉分享按鈕
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true

  [params.homeInfoParams]
    Title = "學習與輸出的角落"
    Content = "好多東東要學習，但腦袋記不住"

